# ============================================================
# 轻语博客 · Cloudflare Pages 配置（Git 连接 / wrangler pages dev 用）
# ------------------------------------------------------------
# 注意：Cloudflare Pages 会自动读取本文件（BETA 功能）。
# 这里只放 Pages 支持的字段；Workers 专属配置（main / [assets]）
# 已拆到 wrangler.workers.toml，避免 Pages 报错
# （例如 'ASSETS' 是 Pages 项目的保留名，不能用作 assets binding 名）。
# ------------------------------------------------------------
# · Pages 部署（Git 连接）：仓库根目录有此文件即可，
#   构建输出目录 public/，functions/ 自动打包成 Pages Functions。
# · 本地预览：npx wrangler pages dev
# ============================================================
name = "azhz"   # Workers 部署默认 worker 名（线上绑定自定义域名 https://www.2024921.xyz）
compatibility_date = "2025-02-01"

# Cloudflare Pages：静态资源目录（也是构建输出目录）
pages_build_output_dir = "public"

# KV 命名空间（云端数据：文章/评论/统计 + 管理员密码哈希）
# 【注意·GitHub Actions 部署】仓库内不存放任何敏感值：
#   · id 用 {env.BLOG_KV_ID} 内插 → 由 GitHub Secrets 提供（见 .github/workflows/deploy.yml）
#   · 设置密钥 / 写入令牌等运行时变量 → 由 Actions 的
#     `wrangler pages secret put` 持久化到 Pages 项目（同样不进仓库）
# 原生 Pages「Git 连接」读不到 GitHub Secrets，若要用 Secrets 请改用 Actions 部署。
# 若坚持原生 Git 连接：请自行创建命名空间后，把真实 id 直接填到下方（会进仓库，注意保密）。
[[kv_namespaces]]
binding = "BLOG"
# id 由 GitHub Actions 的 secrets.BLOG_KV_ID 内插（部署时不落仓库）
id = "{env.BLOG_KV_ID}"

# D1 数据库（主存储；表结构见 migrations/0001_init.sql，部署前由 Actions 自动执行）
[[d1_databases]]
binding = "DB"
database_name = "blog"
database_id = "{env.BLOG_D1_ID}"